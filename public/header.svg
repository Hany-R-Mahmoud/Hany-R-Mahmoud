<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Hany Mahmoud</title>
  <desc id="desc">AI product builder creating frontend systems, mobile apps, dashboards, and Arabic AI education.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="48%" stop-color="#10223f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="42%" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="58%" stop-color="#34d399" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#08111f" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <g opacity="0.16">
    <path d="M0 70H1200M0 130H1200M0 190H1200M0 250H1200M0 310H1200" stroke="#9fb4c9" stroke-width="1"/>
    <path d="M90 0V360M210 0V360M330 0V360M450 0V360M570 0V360M690 0V360M810 0V360M930 0V360M1050 0V360" stroke="#9fb4c9" stroke-width="1"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; -32 0; 0 0" dur="12s" repeatCount="indefinite"/>
  </g>

  <circle cx="940" cy="132" r="190" fill="url(#flare)">
    <animate attributeName="r" values="175;215;175" dur="7s" repeatCount="indefinite"/>
  </circle>
  <path d="M-240 284C70 210 222 330 416 236C610 142 714 76 936 126C1078 158 1138 106 1290 64" fill="none" stroke="url(#scan)" stroke-width="6" opacity="0.65" filter="url(#glow)">
    <animate attributeName="stroke-dasharray" values="120 1300;420 1000;120 1300" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" values="900;0;900" dur="8s" repeatCount="indefinite"/>
  </path>

  <g transform="translate(70 72)">
    <text x="0" y="42" fill="#9fb4c9" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17" letter-spacing="2">AI PRODUCT BUILDER</text>
    <text x="0" y="118" fill="#e6f4ff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="66" font-weight="800">Hany Mahmoud</text>
    <text x="0" y="164" fill="#c7d8ea" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24">Frontend systems, agent UIs, mobile apps, and Arabic AI education.</text>
    <text x="0" y="205" fill="#8fb3d6" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">Solo developer amplified by AI agent teams. Based in Egypt.</text>
  </g>

  <g transform="translate(804 92)" filter="url(#glow)">
    <circle cx="96" cy="86" r="72" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.5"/>
    <circle cx="96" cy="86" r="118" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.28"/>
    <circle cx="96" cy="86" r="42" fill="#22d3ee" opacity="0.09"/>
    <circle cx="96" cy="14" r="7" fill="#22d3ee">
      <animateTransform attributeName="transform" type="rotate" from="0 96 86" to="360 96 86" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="214" cy="86" r="8" fill="#f59e0b">
      <animateTransform attributeName="transform" type="rotate" from="360 96 86" to="0 96 86" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="42" cy="136" r="6" fill="#fb7185">
      <animateTransform attributeName="transform" type="rotate" from="0 96 86" to="360 96 86" dur="13s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(72 294)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">
    <rect x="0" y="0" width="160" height="34" rx="17" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="20" y="22" fill="#e6f4ff">Next.js</text>
    <rect x="176" y="0" width="176" height="34" rx="17" fill="#34d399" fill-opacity="0.13" stroke="#34d399" stroke-opacity="0.55"/>
    <text x="196" y="22" fill="#e6f4ff">React Native</text>
    <rect x="368" y="0" width="154" height="34" rx="17" fill="#f59e0b" fill-opacity="0.13" stroke="#f59e0b" stroke-opacity="0.55"/>
    <text x="388" y="22" fill="#e6f4ff">Supabase</text>
    <rect x="538" y="0" width="176" height="34" rx="17" fill="#8b5cf6" fill-opacity="0.16" stroke="#8b5cf6" stroke-opacity="0.6"/>
    <text x="558" y="22" fill="#e6f4ff">AI Agents</text>
  </g>
</svg>
